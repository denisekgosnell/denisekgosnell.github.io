    <section class="content" aria-labelledby="book-title">
      <p class="eyebrow">Pre-order list</p>
      <h1 class="title" id="book-title">
        <span class="title-the">The</span>
        <span class="title-main"><span class="nowrap">Closed-Loop</span> Enterprise</span>
      </h1>
      <p class="subtitle">
        <span>Why AI Needs Feedback Loops and</span>
        <span>How Every Team Can Build Them</span>
      </p>
      <p class="authors">
        <span>Dr. Matthias Broecheler</span>
        <span class="leader" aria-hidden="true"></span>
        <span>Dr. Denise Gosnell</span>
      </p>

      <form class="signup" id="signup" novalidate>
        <p class="signup-intro">Be the first to know when the book is available.</p>
        <div class="field">
          <label for="signup-name">Name</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
        </div>
        <div class="trap" aria-hidden="true">
          <label for="signup-leave-blank">Leave this field blank</label>
          <input id="signup-leave-blank" name="leave_blank" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" class="submit">Join the pre-order list</button>
        <p class="status" id="signup-status" role="status" aria-live="polite"></p>
        <noscript><p class="status is-error">Please enable JavaScript to join the list.</p></noscript>
        <p class="fineprint">We'll only use your email to send you updates about the book.</p>
      </form>

      <div class="success" id="signup-success" hidden>
        <svg class="success-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="21" r="15" fill="none" stroke="#932EE9" stroke-width="4"/>
          <circle cx="24" cy="36" r="4.5" fill="#932EE9"/>
        </svg>
        <h2 class="success-title" tabindex="-1">You're on the list.</h2>
        <p class="success-message" id="signup-success-message"></p>
      </div>
    </section>
